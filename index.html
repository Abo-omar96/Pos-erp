<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#4f46e5" />
    <title>ميجابايت— برنامج الحسابات</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
    <script>
      /* تطبيق ألوان المظهر المحفوظة مبكرًا لتفادي وميض الألوان الافتراضية */
      try {
        var saved = JSON.parse(localStorage.getItem("daftar.theme") || "null");
        var th = saved && saved.theme;
        if (th) {
          var ok = function (v) { return /^#[0-9a-f]{6}$/i.test(v || ""); };
          var st = document.documentElement.style;
          ["primary", "sidebar", "bg", "card", "ink"].forEach(function (k) { if (ok(th[k])) st.setProperty("--" + k, th[k]); });
          var lum = function (hex) { var c = [1, 3, 5].map(function (i) { var s = parseInt(hex.slice(i, i + 2), 16) / 255; return s <= 0.03928 ? s / 12.92 : Math.pow((s + 0.055) / 1.055, 2.4); }); return 0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2]; };
          if (ok(th.sidebar)) st.setProperty("--sidebar-ink", lum(th.sidebar) > 0.45 ? "#1e293b" : "#ffffff");
          if (ok(th.bg)) st.colorScheme = lum(th.bg) < 0.25 ? "dark" : "light";
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <section id="login-screen" class="login-screen">
      <div class="login-card">
        <div class="brand-mark">MB</div>
        <p class="eyebrow">برنامج الحسابات</p>
        <h1>مرحبًا بعودتك</h1>
        <p class="muted">سجّل الدخول للوصول إلى بيانات منشأتك.</p>
        <form id="login-form" class="stack-form">
          <label>البريد الإلكتروني<input type="email" name="email" autocomplete="username" required /></label>
          <label>كلمة المرور<input type="password" name="password" autocomplete="current-password" required /></label>
          <button class="button button-primary button-wide" type="submit">تسجيل الدخول</button>
        </form>
        <div id="login-message" class="form-message" role="status"></div>
        <p class="login-help">تُنشأ حسابات المستخدمين من لوحة Firebase بواسطة مسؤول النظام.</p>
      </div>
    </section>

    <div id="app-shell" class="app-shell is-hidden">
      <div id="menu-backdrop" class="menu-backdrop"></div>
      <aside class="sidebar">
        <a class="brand" href="#" data-page="dashboard" aria-label="الرئيسية">
          <span class="brand-mark">MB</span>
          <span><strong>ميجابايت</strong><small>إدارة أعمالك بسهولة</small></span>
        </a>
        <div class="nav-caption">القائمة الرئيسية</div>
        <nav id="main-nav" class="main-nav">
          <button class="nav-link active" data-page="dashboard"><span class="nav-icon">⌂</span>الرئيسية</button>
          <button class="nav-link" data-page="sales"><span class="nav-icon">↗</span>فواتير المبيعات</button>
          <button class="nav-link" data-page="purchases"><span class="nav-icon">↙</span>فواتير المشتريات</button>
          <button class="nav-link" data-page="returns"><span class="nav-icon">↺</span>المرتجعات</button>
          <button class="nav-link" data-page="items"><span class="nav-icon">▦</span>الأصناف والمخزون</button>
          <button class="nav-link" data-page="customers"><span class="nav-icon">♙</span>العملاء</button>
          <button class="nav-link" data-page="suppliers"><span class="nav-icon">♧</span>الموردون</button>
          <button class="nav-link" data-page="payments"><span class="nav-icon">⇄</span>سندات القبض والصرف</button>
          <button class="nav-link" data-page="expenses"><span class="nav-icon">−</span>المصروفات</button>
          <button class="nav-link" data-page="employees"><span class="nav-icon">☺</span>الموظفون</button>
          <button class="nav-link" data-page="payroll"><span class="nav-icon">₪</span>الرواتب</button>
          <button class="nav-link" data-page="inventory"><span class="nav-icon">▤</span>حركة المخزون</button>
          <button class="nav-link" data-page="analytics"><span class="nav-icon">◈</span>التحليلات</button>
          <button class="nav-link" data-page="statements"><span class="nav-icon">☷</span>كشف حساب</button>
          <button class="nav-link" data-page="reports"><span class="nav-icon">▥</span>التقارير</button>
          <button class="nav-link" data-page="settings"><span class="nav-icon">⚙</span>الإعدادات</button>
        </nav>
        <div class="sidebar-bottom">
          <div class="cloud-status"><span class="status-dot"></span><span>قاعدة البيانات متصلة</span></div>
          <div id="user-email" class="user-email"></div>
          <button id="logout-button" class="button button-quiet button-wide">تسجيل الخروج</button>
        </div>
      </aside>

      <main class="main-area">
        <header class="topbar">
          <button id="mobile-menu" class="icon-button mobile-menu" aria-label="فتح القائمة">☰</button>
          <div>
            <p class="eyebrow" id="today-label"></p>
            <h1 id="page-title">الرئيسية</h1>
          </div>
          <div class="topbar-actions">
            <button id="refresh-button" class="button button-outline">↻ <span>تحديث البيانات</span></button>
            <span class="avatar">م</span>
          </div>
        </header>
        <section id="page-content" class="page-content" aria-live="polite"></section>
      </main>
    </div>

    <div id="theme-bar" class="theme-bar is-hidden" role="status">
      <span>معاينة مظهر غير محفوظة</span>
      <span class="theme-bar-actions"><button id="theme-bar-save" class="button button-primary" type="button">حفظ المظهر</button><button id="theme-bar-discard" class="button button-outline" type="button">تراجع</button></span>
    </div>
    <div id="modal-root"></div>
    <div id="toast-root" class="toast-root" aria-live="polite"></div>
    <script type="module" src="app.js"></script>
  </body>
</html>
