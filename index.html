<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f766e" />
    <title>دفتر — برنامج الحسابات</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <section id="login-screen" class="login-screen">
      <div class="login-card">
        <div class="brand-mark">د</div>
        <p class="eyebrow">برنامج الحسابات</p>
        <h1>مرحبًا بعودتك</h1>
        <p class="muted">سجّل الدخول للوصول إلى بيانات منشأتك.</p>
        <form id="login-form" class="stack-form">
          <label>البريد الإلكتروني<input type="email" name="email" autocomplete="username" required /></label>
          <label>كلمة المرور<input type="password" name="password" autocomplete="current-password" required /></label>
          <button class="button button-primary button-wide" type="submit">تسجيل الدخول</button>
        </form>
        <p id="login-message" class="form-message" role="status"></p>
        <p class="login-help">تُنشأ حسابات المستخدمين من لوحة Firebase بواسطة مسؤول النظام.</p>
      </div>
    </section>

    <div id="app-shell" class="app-shell is-hidden">
      <aside class="sidebar">
        <a class="brand" href="#" data-page="dashboard" aria-label="الرئيسية">
          <span class="brand-mark">د</span>
          <span><strong>دفتر</strong><small>إدارة أعمالك بسهولة</small></span>
        </a>
        <div class="nav-caption">القائمة الرئيسية</div>
        <nav id="main-nav" class="main-nav">
          <button class="nav-link active" data-page="dashboard"><span class="nav-icon">⌂</span>الرئيسية</button>
          <button class="nav-link" data-page="sales"><span class="nav-icon">↗</span>فواتير المبيعات</button>
          <button class="nav-link" data-page="purchases"><span class="nav-icon">↙</span>فواتير المشتريات</button>
          <button class="nav-link" data-page="items"><span class="nav-icon">▦</span>الأصناف والمخزون</button>
          <button class="nav-link" data-page="customers"><span class="nav-icon">♙</span>العملاء</button>
          <button class="nav-link" data-page="suppliers"><span class="nav-icon">♧</span>الموردون</button>
          <button class="nav-link" data-page="payments"><span class="nav-icon">⇄</span>سندات القبض والصرف</button>
          <button class="nav-link" data-page="expenses"><span class="nav-icon">−</span>المصروفات</button>
          <button class="nav-link" data-page="inventory"><span class="nav-icon">▤</span>حركة المخزون</button>
          <button class="nav-link" data-page="reports"><span class="nav-icon">▥</span>التقارير</button>
          <button class="nav-link" data-page="settings"><span class="nav-icon">⚙</span>الإعدادات</button>
        </nav>
        <div class="sidebar-bottom">
          <div class="cloud-status"><span class="status-dot"></span><span>قاعدة البيانات متصلة</span></div>
          <div id="user-email" class="user-email"></div>
          <button id="logout-button" class="button button-quiet button-wide">تسجيل الخروج</button>
        </div>
      </aside>

      <main class="main-area">
        <header class="topbar">
          <button id="mobile-menu" class="icon-button mobile-menu" aria-label="فتح القائمة">☰</button>
          <div>
            <p class="eyebrow" id="today-label"></p>
            <h1 id="page-title">الرئيسية</h1>
          </div>
          <div class="topbar-actions">
            <button id="refresh-button" class="button button-outline">↻ <span>تحديث البيانات</span></button>
            <span class="avatar">م</span>
          </div>
        </header>
        <section id="page-content" class="page-content" aria-live="polite"></section>
      </main>
    </div>

    <div id="modal-root"></div>
    <div id="toast-root" class="toast-root" aria-live="polite"></div>
    <script type="module" src="app.js"></script>
  </body>
</html>
